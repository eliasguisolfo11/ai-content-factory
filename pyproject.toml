[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-factory"
version = "0.1.0"
description = "Local research-to-script MVP for short-form factual videos"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
content-factory = "content_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
